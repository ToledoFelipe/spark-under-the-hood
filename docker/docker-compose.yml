#   - spark-master  = Cluster Manager (aloca recursos, não roda seu código)
#   - spark-worker  = a máquina que HOSPEDA os executors (1 worker pode
#                      rodar mais de um executor, dependendo de cores/memória)
#   - spark-submit  = onde o Driver roda (client mode): é o processo que
#                      executa o seu código main, monta o DAG e manda o
#                      trabalho pro master distribuir entre os workers.

services:
  spark-master:
    build: .
    hostname: spark-master
    command: >
      bash -c "$$SPARK_HOME/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 8080"
    ports:
      - "8080:8080"   # UI do master: mostra workers registrados e apps rodando
      - "7077:7077"   # porta RPC que master e worker usam pra se falar
    networks:
      - spark-net

  spark-worker:
    build: .
    depends_on:
      - spark-master
    volumes:
      - ../:/app   # executors run here — need the same /app/data as the driver to read local files
    # Cores/memory are overridable via env vars (see .env / SETUP.md "Performance testing")
    # so a perf test can go higher without changing the everyday dev default.
    command: >
      bash -c "$$SPARK_HOME/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --webui-port 8081
      --cores ${SPARK_WORKER_CORES:-2} --memory ${SPARK_WORKER_MEMORY:-2g}"
    deploy:
      resources:
        limits:
          cpus: "${SPARK_WORKER_CORES:-2}"
          memory: ${SPARK_WORKER_MEMORY:-2g}
    ports:
      - "8081-8090:8081"   # range pra caber múltiplos workers se você escalar
    environment:
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES:-2}
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY:-2g}
    networks:
      - spark-net
    # Pra ter mais de um worker (simular mais paralelismo):
    #   docker compose up --scale spark-worker=3

  spark-submit:
    build: .
    depends_on:
      - spark-master
      - spark-worker
    volumes:
      - ../:/app   # repo root, not just docker/ — so scripts/, data/, notes/ are all visible
    deploy:
      resources:
        limits:
          cpus: "${SPARK_DRIVER_CORES:-2}"
          memory: ${SPARK_DRIVER_MEMORY:-2g}
    # Stays idle by design, not run-and-exit — so `docker compose exec spark-submit ...`
    # and VS Code's "Attach to Running Container" always have something to attach to.
    # To actually run a job: docker compose exec spark-submit spark-submit --master
    # spark://spark-master:7077 /app/scripts/test_spark.py
    command: tail -f /dev/null
    ports:
      - "4040:4040"   # UI da aplicação (só existe enquanto o job está rodando)
    networks:
      - spark-net

networks:
  spark-net:
    driver: bridge